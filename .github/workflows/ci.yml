name: CI

on: push

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15-intel
          - windows-2022

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install calibre dependencies
        run: python setup/unix-ci.py install

      - name: Verify bundled PoDoFo API on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          HEADER=/sw/sw/include/podofo/main/PdfDocument.h

          test -f "$HEADER"

          echo "Bundled PoDoFo API:"
          grep -n "CreateXObjectForm" "$HEADER" || true

          echo "Calibre source API:"
          grep -n "CreateXObjectForm" \
            src/calibre/utils/podofo/impose.cpp || true

          if ! grep -Eq \
            'CreateXObjectForm[[:space:]]*\([^)]*,[^)]*\)' \
            "$HEADER"; then
            echo "::error::Bundled PoDoFo API is incompatible with calibre source."
            echo "::error::A compatible dependency bundle or source repair is required."
            exit 1
          fi

      - name: Bootstrap calibre
        run: python setup/unix-ci.py bootstrap

      - name: Test calibre
        env:
          PYTHONWARNINGS: error
          CALIBRE_SHOW_DEPRECATION_WARNINGS: 1
        run: python setup/unix-ci.py test

  archtest:
    name: Test on Arch
    runs-on: ubuntu-24.04

    container:
      image: archlinux/archlinux:latest
      env:
        CI: 'true'

    steps:
      - name: Setup container
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm tar

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install calibre dependencies
        run: setup/arch-ci.sh

      - name: Bootstrap calibre
        run: |
          runuser -u ci -- python setup.py bootstrap \
            --ephemeral --debug --sanitize

      - name: Test calibre
        env:
          PYTHONWARNINGS: error
          CALIBRE_SHOW_DEPRECATION_WARNINGS: 1
        run: |
          set -xe
          runuser -u ci -- python setup.py test --under-sanitize
          echo "Running test_rs"
          runuser -u ci -- python setup.py test_rs
